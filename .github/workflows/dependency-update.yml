name: Dependency Update Check

on:
  schedule:
    - cron: '0 0 1 * *'   # 每月 1 号 UTC 0:00
  workflow_dispatch:         # 手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check vcpkg baseline
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── Get current baseline from vcpkg.json ──
      - name: Read current baseline
        id: current
        shell: bash
        run: |
          CURRENT=$(grep -oP '"builtin-baseline"\s*:\s*"\K[a-f0-9]+' vcpkg.json || echo "")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current baseline: $CURRENT"

      # ── Clone latest vcpkg and get HEAD SHA ──
      - name: Get latest vcpkg baseline
        id: latest
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg-latest
          LATEST=$(cd /tmp/vcpkg-latest && git rev-parse HEAD)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest baseline: $LATEST"

      # ── Skip if already up to date ──
      - name: Check if update needed
        shell: bash
        run: |
          if [ "${{ steps.current.outputs.current }}" = "${{ steps.latest.outputs.latest }}" ]; then
            echo "Baseline is already up to date. Nothing to do."
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "New baseline available. Proceeding with build verification."
            echo "skip=false" >> $GITHUB_ENV
          fi

      # ── Restore Qt cache (same as main build) ──
      - name: Restore Qt cache
        if: env.skip == 'false'
        uses: actions/cache@v4
        id: cache-qt
        with:
          path: C:/Qt/6.10.1/msvc2022_64
          key: qt-6.10.1-msvc2022_64

      - name: Install Qt 6.10.1
        if: env.skip == 'false' && steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.10.1 win64_msvc2022_64 --outputdir C:/Qt

      # ── Bootstrap latest vcpkg and install deps ──
      - name: Setup latest vcpkg
        if: env.skip == 'false'
        shell: bash
        run: |
          cp -r /tmp/vcpkg-latest "${{ github.workspace }}/vcpkg-latest"
          "${{ github.workspace }}/vcpkg-latest/bootstrap-vcpkg.bat"

      # ── Build with new baseline ──
      - name: Build with new baseline (MSVC)
        if: env.skip == 'false'
        run: |
          cmake --preset msvc `
            -DBUILD_TESTING=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg-latest/scripts/buildsystems/vcpkg.cmake" `
            -DQt6_DIR="C:/Qt/6.10.1/msvc2022_64/lib/cmake/Qt6" `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.10.1/msvc2022_64"
          cmake --build build/vcpkg-msvc --config Release --parallel

      # ── Run tests ──
      - name: Test with new baseline
        if: env.skip == 'false'
        run: |
          $env:PATH = "C:/Qt/6.10.1/msvc2022_64/bin;${{ github.workspace }}/vcpkg-latest/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build/vcpkg-msvc -C Release --output-on-failure

      # ── Update vcpkg.json with new baseline ──
      - name: Update vcpkg.json baseline
        if: env.skip == 'false'
        shell: bash
        run: |
          git checkout -b "chore/deps-vcpkg-baseline-$(date +%Y-%m)"
          sed -i "s/\"builtin-baseline\": \"[a-f0-9]*\"/\"builtin-baseline\": \"${{ steps.latest.outputs.latest }}\"/" vcpkg.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vcpkg.json
          git commit -m "chore(deps): update vcpkg baseline to ${{ steps.latest.outputs.latest }}

      Auto-detected by monthly dependency update check.
      Old baseline: ${{ steps.current.outputs.current }}
      New baseline: ${{ steps.latest.outputs.latest }}

      Build + tests passed on MSVC."

      # ── Create PR ──
      - name: Create Pull Request
        if: env.skip == 'false'
        run: |
          git push origin "chore/deps-vcpkg-baseline-$(date +%Y-%m)" --force
          gh pr create \
            --title "chore(deps): vcpkg baseline update $(date +%Y-%m)" \
            --body "## Dependency Update

      - **Old baseline:** \`${{ steps.current.outputs.current }}\`
      - **New baseline:** \`${{ steps.latest.outputs.latest }}\`

      ✅ MSVC build passed
      ✅ Tests passed

      Auto-generated by [monthly dependency update check](https://github.com/${{ github.repository }}/actions/workflows/dependency-update.yml)." \
            --base develop \
            --head "chore/deps-vcpkg-baseline-$(date +%Y-%m)"
        env:
          GH_TOKEN: ${{ github.token }}

      # ── Open Issue on failure ──
      - name: Open Issue on failure
        if: failure() && steps.latest.outputs.latest != ''
        run: |
          gh issue create \
            --title "vcpkg baseline update $(date +%Y-%m) — build failure" \
            --body "## Build Failed

      Attempted vcpkg baseline update:
      - **Old baseline:** \`${{ steps.current.outputs.current }}\`
      - **New baseline:** \`${{ steps.latest.outputs.latest }}\`

      The build or tests failed with the new baseline. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

      Manual investigation required." \
            --label "dependencies,bug"
        env:
          GH_TOKEN: ${{ github.token }}
